# configs/config.yaml
pipeline:
  random_state: 42
  test_size: 0.2
  n_clusters: 3        # KMeans clusters for proxy target
  cv_folds: 5
  scoring: "roc_auc"

models:
  logistic:
    max_iter: [1000]
    solver: "liblinear"
    penalty: "l2"
    C: [0.01, 0.1, 1, 10]

  random_forest:
    n_estimators: [100, 200]
    max_depth: [5, 10, null]
    min_samples_split: [2, 5, 10]

  gradient_boosting:
    n_estimators: [100, 200]
    learning_rate: [0.05, 0.1, 0.2]
    max_depth: [3, 5]

  xgboost:                       # <-- Moved inside 'models'
    n_estimators: [200, 500]
    max_depth: [3, 5, 7]
    learning_rate: [0.01, 0.05, 0.1]
    subsample: [0.8, 1.0]
    colsample_bytree: [0.8, 1.0]

mlflow:
  experiment_name: "credit_risk_model"
  tracking_uri: "file:./mlruns"

paths:
  raw_data: "data/raw/transactions.csv"
  processed_data: "data/processed/"
  models: "models/"
  reports: "reports/"
