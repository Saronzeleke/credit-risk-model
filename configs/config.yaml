# Configuration for Credit Risk Model
pipeline:
  random_state: 42
  test_size: 0.2
  n_clusters: 3  # For K-Means in target engineering

models:
  logistic:
    solver: "liblinear"
    penalty: "l2"
    max_iter: 1000
  random_forest:
    n_estimators: [100, 200]
    max_depth: [5, 10, None]
    min_samples_split: [2, 5]
  gradient_boosting:
    n_estimators: [100, 200]
    learning_rate: [0.05, 0.1, 0.2]
    max_depth: [3, 5]

mlflow:
  experiment_name: "credit_risk_model"
  tracking_uri: "mlruns"

paths:
  raw_data: "data/raw/transactions.csv"
  processed_data: "data/processed/"
  models: "models/"
  reports: "reports/"